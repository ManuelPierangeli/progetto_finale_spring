<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

    <head th:insert="~{index :: navbar}"></head>

    <div class="min-vh-100">
        <div th:if="${successMessage}" class="alert alert-success">
            <p th:text="${successMessage}"></p>
        </div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-10 mb-5">
                    <h1 class="text-center" th:text="${title}">Index article</h1>
                </div>
            </div>
        </div>

        <div class="container" th:if="${articles.size() > 0}">
            <div class="row justify-content-center mb-5 g-4">
                <div th:each="article:${articles}" class="col-12 col-md-6 col-lg-4 d-flex justify-content-center">
                    <!-- Standardizzata la card con h-100 w-100 e classi per arrotondamento/ombra coerenti -->
                    <div class="card article-card h-100 w-100 shadow-sm border-0 rounded-4 overflow-hidden mb-3">
                        
                        <!-- Immagine con wrapper standardizzato -->
                        <div class="card-img-wrapper">
                            <img th:if="${article.image != null}" th:src="${article.image.path}" class="card-img-top object-fit-cover"
                                alt="...">
                            <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}" class="card-img-top object-fit-cover"
                                alt="...">
                        </div>

                        <!-- Corpo card in flex column per gestire l'allineamento dei contenuti -->
                        <div class="card-body d-flex flex-column p-4">
                            <h5 class="card-title fw-bold text-dark" th:text="${article.title}"></h5>
                            <p class="card-text text-muted small mb-3" th:text="${article.subtitle}"></p>
                            
                            <!-- Spinge gli elementi finali (autore e bottone) sempre in fondo alla card -->
                            <div class="mt-auto">
                                <p class="card-text text-secondary small mb-3">
                                    <i class="fas fa-user-pen me-1"></i> <span th:text="${article.user.username}"></span>
                                </p>
                                <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary w-100">Leggi</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center vh-100" th:unless="${articles.size() > 0}">
            <div class="col-10 mb-5">
                <h1 class="text-center">NESSUN ARTICOLO PRESENTE</h1>
            </div>
        </div>
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
