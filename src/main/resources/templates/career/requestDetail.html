<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

    <!-- Navbar -->
    <header>
        <div th:insert="~{index :: navbar}"></div>
    </header>

    <main>
        <!-- Header della pagina -->
        <section class="container-fluid py-5 bg-light border-bottom text-center">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <span
                        class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill mb-3 fw-semibold text-uppercase">Area
                        Amministrativa</span>
                    <h1 class="display-5 fw-bold text-dark">Richiesta di Ruolo</h1>
                </div>
            </div>
        </section>

        <!-- Contenuto Principale -->
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">

                    <!-- Card Richiesta -->
                    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white mb-4">

                        <!-- Info Utente -->
                        <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                            <div class="bg-primary-subtle text-primary rounded-circle p-3 me-3 d-flex align-items-center justify-content-center"
                                style="width: 50px; height: 50px;">
                                <i class="fas fa-user fa-lg"></i>
                            </div>
                            <div>
                                <span class="text-muted small d-block">Utente Richiedente</span>
                                <h3 class="h4 fw-bold text-dark mb-0" th:text="${request.user.username}">Nome utente
                                </h3>
                            </div>
                        </div>

                        <!-- Messaggio / Motivazione -->
                        <div class="mb-5">
                            <h5 class="fw-semibold text-secondary mb-3">Motivazione / Messaggio:</h5>
                            <div class="p-4 bg-light rounded-3 text-secondary lh-lg fs-5">
                                <p class="mb-0" th:text="${request.body}"></p>
                            </div>
                        </div>

                        <!-- Azioni Amministratore -->
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 pt-3 border-top">
                            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary px-4 py-2 rounded-pill">
                                <i class="fas fa-arrow-left me-2"></i> Torna indietro
                            </a>

                            <form th:action="@{/operations/career/request/accept/{id}(id=${request.id})}" method="post">
                                <button type="submit" class="btn btn-success px-4 py-2 rounded-pill shadow-sm">
                                    <i class="fas fa-check me-2"></i> Accetta Richiesta
                                </button>
                            </form>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:insert="~{index :: footer}"></footer>

    <!-- Script Bootstrap -->
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>s
