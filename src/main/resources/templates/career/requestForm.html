<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

    <!-- Navbar -->
    <header>
        <div th:insert="~{index :: navbar}"></div>
    </header>

    <!-- Contenuto Principale -->
    <main class="container py-5 my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Header della pagina -->
                <div class="text-center mb-4">
                    <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill mb-2 fw-semibold text-uppercase">Opportunità di Carriera</span>
                    <h1 class="fw-bold text-dark" th:text="${title}">Richiesta collaborazione</h1>
                    <p class="text-muted">Invia una richiesta per entrare a far parte del nostro team con un nuovo ruolo.</p>
                </div>

                <!-- Form Card -->
                <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
                    <div class="card-body">
                        <form th:action="@{/operations/career/request/save}" method="POST" th:object="${careerRequest}"
                            enctype="multipart/form-data">
                            
                            <!-- Selezione Ruolo -->
                            <div class="mb-4">
                                <label for="role" class="form-label fw-semibold text-dark">Per quale ruolo vuoi candidarti?</label>
                                <select id="role" th:field="*{role}" class="form-select py-2">
                                    <option th:each="role:${roles}" th:value="${role.id}"
                                        th:text="${#strings.substring(role.name, 5)}"></option>
                                </select>
                            </div>

                            <!-- Motivazione -->
                            <div class="mb-4">
                                <label for="body" class="form-label fw-semibold text-dark">Motivo della richiesta</label>
                                <textarea id="body" class="form-control" rows="5" th:field="*{body}"
                                    placeholder="Inserisci le tue motivazioni, le tue competenze o perché vorresti ricoprire questo ruolo..."></textarea>
                            </div>

                            <!-- Pulsante Inoltro -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary py-2 rounded-pill shadow-sm">
                                    <i class="fas fa-paper-plane me-2"></i> Effettua richiesta
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

                <!-- Torna indietro -->
                <div class="text-center mt-4">
                    <a href="javascript:history.back()" class="text-secondary text-decoration-none small">
                        <i class="fas fa-arrow-left me-1"></i> Torna indietro
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:insert="~{index :: footer}"></footer>

    <!-- Script Bootstrap -->
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
