<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
    <!-- Navbar -->
    <header>
        <div th:insert="~{index :: navbar}"></div>
    </header>

    <!-- Contenuto Principale -->
    <main class="container py-5 my-4">

        <!-- Messaggio di successo -->
        <div th:if="${successMessage}" class="alert alert-success shadow-sm border-0 rounded-3 mb-4" role="alert">
            <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
        </div>

        <!-- Header della Dashboard -->
        <div class="row mb-4">
            <div class="col-12 text-center text-md-start">
                <h1 class="fw-bold text-dark">Dashboard Writer</h1>
                <p class="text-muted" th:text="${title}">Gestisci i tuoi articoli pubblicati</p>
            </div>
        </div>

        <!-- Tabella Articoli -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-uppercase fs-7">
                                    <tr>
                                        <th class="py-3 ps-4">#ID</th>
                                        <th class="py-3">Titolo</th>
                                        <th class="py-3">Sottotitolo</th>
                                        <th class="py-3">Categoria</th>
                                        <th class="py-3 text-end pe-4">Azioni</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="article:${articles}">
                                        <td class="ps-4 fw-semibold text-secondary" th:text="${article.id}"></td>
                                        <td class="fw-bold text-dark" th:text="${article.title}"></td>
                                        <td class="text-muted text-truncate" style="max-width: 250px;"
                                            th:text="${article.subtitle}"></td>
                                        <td>
                                            <span class="badge bg-light text-dark border px-2 py-1"
                                                th:if="${article.category}" th:text="${article.category.name}"></span>
                                            <span class="badge bg-secondary-subtle text-secondary px-2 py-1"
                                                th:unless="${article.category}">Nessuna categoria</span>
                                        </td>
                                        <td class="text-end pe-4">
                                            <div class="d-flex justify-content-end gap-2">
                                                <a th:href="@{/articles/detail/{id}(id=${article.id})}"
                                                    class="btn btn-sm btn-outline-primary" title="Leggi">
                                                    <i class="fa-solid fa-bars"></i>
                                                </a>
                                                <a th:href="@{/articles/edit/{id}(id=${article.id})}"
                                                    class="btn btn-sm btn-outline-warning" title="Modifica">
                                                    <i class="fa-solid fa-pen"></i>
                                                </a>
                                                <a th:href="@{/articles/delete/{id}(id=${article.id})}"
                                                    class="btn btn-sm btn-outline-danger" title="Elimina">
                                                    <i class="fa-solid fa-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <!-- Stato vuoto se non ci sono articoli -->
                                    <tr th:if="${articles.empty}">
                                        <td colspan="5" class="text-center py-4 text-muted">
                                            Non hai ancora scritto alcun articolo.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:insert="~{index :: footer}"></footer>

    <!-- Script Bootstrap -->
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
