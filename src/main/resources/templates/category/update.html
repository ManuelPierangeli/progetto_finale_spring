<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

    <!-- Navbar -->
    <header>
        <div th:insert="~{index :: navbar}"></div>
    </header>

    <!-- Contenuto Principale -->
    <main class="container py-5 my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- Header della pagina -->
                <div class="text-center mb-4">
                    <span
                        class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill mb-2 fw-semibold text-uppercase">Gestione
                        Categorie</span>
                    <h1 class="fw-bold text-dark" th:text="${title}">Modifica la categoria</h1>
                    <p class="text-muted">Aggiorna il nome della categoria selezionata.</p>
                </div>

                <!-- Form Card -->
                <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                    <div class="card-body">
                        <form th:action="@{/categories/update/{id}(id=${category.id})}" method="post"
                            th:object="${category}">

                            <div class="mb-4">
                                <label for="name" class="form-label fw-semibold text-dark">Nome categoria</label>
                                <input id="name" type="text" class="form-control" th:field="*{name}"
                                    placeholder="Inserisci il nome...">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}"
                                    th:errors="*{name}"></div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-warning py-2 rounded-pill shadow-sm text-white">
                                    <i class="fas fa-pen-to-square me-2"></i> Aggiorna categoria
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

                <!-- Torna indietro -->
                <div class="text-center mt-4">
                    <a href="javascript:history.back()" class="text-secondary text-decoration-none small">
                        <i class="fas fa-arrow-left me-1"></i> Torna indietro
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:insert="~{index :: footer}"></footer>

    <!-- Script Bootstrap -->
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
