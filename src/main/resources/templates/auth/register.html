<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

    <!-- Navbar -->
    <header>
        <div th:insert="~{index :: navbar}"></div>
    </header>

    <!-- Contenuto Principale -->
    <main class="container py-5 my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- Card Registrazione -->
                <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
                    <div class="card-body p-0">

                        <!-- Header del Form -->
                        <div class="text-center mb-4">
                            <span
                                class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill mb-2 fw-semibold text-uppercase">Unisciti
                                a noi</span>
                            <h1 class="h3 fw-bold text-dark">Crea un account</h1>
                            <p class="text-muted small">Compila i campi sottostanti per registrarti.</p>
                        </div>

                        <!-- Form -->
                        <form method="post" role="form" th:action="@{/register/save}" th:object="${user}">

                            <div class="mb-3">
                                <label for="firstName" class="form-label fw-semibold text-dark">Nome</label>
                                <input class="form-control" id="firstName" name="firstName"
                                    placeholder="Inserisci il tuo nome" th:field="*{firstName}" type="text" />
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}"
                                    th:errors="*{firstName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="lastName" class="form-label fw-semibold text-dark">Cognome</label>
                                <input class="form-control" id="lastName" name="lastName"
                                    placeholder="Inserisci il tuo cognome" th:field="*{lastName}" type="text" />
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}"
                                    th:errors="*{lastName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold text-dark">Email</label>
                                <input class="form-control" id="email" name="email"
                                    placeholder="Inserisci il tuo indirizzo email" th:field="*{email}" type="email" />
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}"
                                    th:errors="*{email}"></div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-dark">Password</label>
                                <input class="form-control" id="password" name="password"
                                    placeholder="Crea una password sicura" th:field="*{password}" type="password" />
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}"></div>
                            </div>

                            <div class="d-grid mb-3">
                                <button class="btn btn-primary py-2 rounded-pill shadow-sm" type="submit">
                                    <i class="fas fa-user-plus me-2"></i> Registrati
                                </button>
                            </div>

                            <div class="text-center mt-4 pt-3 border-top">
                                <span class="text-muted small">Hai già un account?
                                    <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Accedi
                                        qui</a>
                                </span>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:insert="~{index :: footer}"></footer>

    <!-- Script Bootstrap -->
    <script th:replace="~{index :: bootstrapScript}"></script>

</body>

</html>
